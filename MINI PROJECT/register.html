
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Student Registration</h1>

    <form id="studentForm">
        <input id="name" placeholder="Student Name" required>
        <input id="roll" placeholder="Roll Number" required>
        <input id="branch" placeholder="Branch" required>
        <input id="exam" placeholder="Exam Name" required>
        <input id="date" type="date" required>

        <button type="submit">Submit</button>
    </form>

    <p id="message"></p>

    <button onclick="location.href='index.html'">
        Home
    </button>

    <button onclick="location.href='arrangement.html'">
        View Arrangement
    </button>

</body>
</html>
