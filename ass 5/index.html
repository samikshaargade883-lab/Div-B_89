<!DOCTYPE html>
<html>
<head>
    <title>VSEC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="screen">

        <div class="box red" onclick="moveBoxes()">1</div>
        <div class="box blue" onclick="moveBoxes()">2</div>
        <div class="box green" onclick="moveBoxes()">3</div>
        <div class="box yellow" onclick="moveBoxes()">4</div>

        <div class="text" id="text">
            Hello...!!!!
        </div>

    </div>

    <script>
        function moveBoxes() {
            document.querySelector(".screen").classList.toggle("open");
        }
    </script>

</body>
</html>
