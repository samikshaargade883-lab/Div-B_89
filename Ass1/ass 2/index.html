
<!DOCTYPE html>
<html>
<head>
    <title>Colour Change</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Colour Change</h1>

    <div class="box" id="box">
        Hello!
    </div>

    <button onclick="changeColor()">Change Colour</button>

    <script>
        function changeColor() {
            document.getElementById("box").style.backgroundColor = "pink";
        }
    </script>

</body>
</html>
